name: TypeChecking

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
  pull_request:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          pip install -r reqs.txt
          pip install mypy

      - name: Run mypy
        run: python -m mypy --ignore-missing-imports --check-untyped-defs .
